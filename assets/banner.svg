<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Glowing Cyber Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#00f2fe" />
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#102046" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#00f2fe" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace; }
    .pulse-orb {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .radar-sweep {
      transform-origin: 1040px 110px;
      animation: sweep 6s linear infinite;
    }
    .wave-line {
      stroke-dasharray: 8 6;
      animation: dash 12s linear infinite;
    }
    .status-ping {
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      transform-origin: 170px 65px;
    }
    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.95); }
      100% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes ping {
      0% { r: 4px; opacity: 1; }
      75%, 100% { r: 14px; opacity: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Glowing Background Orbs (Behind content) -->
  <circle cx="150" cy="100" r="120" fill="#7928ca" opacity="0.25" filter="url(#glow)" class="pulse-orb" />
  <circle cx="1040" cy="110" r="140" fill="#00f2fe" opacity="0.2" filter="url(#glow)" class="pulse-orb" style="animation-delay: -2s;" />
  <circle cx="600" cy="380" r="100" fill="#00d2ff" opacity="0.15" filter="url(#glow)" class="pulse-orb" style="animation-delay: -1s;" />

  <!-- Dynamic Radar Visual on Right -->
  <g opacity="0.75">
    <circle cx="1040" cy="110" r="85" fill="none" stroke="#163866" stroke-width="1.5" />
    <circle cx="1040" cy="110" r="55" fill="none" stroke="#1e4d8c" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1040" cy="110" r="25" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.8" />
    <line x1="955" y1="110" x2="1125" y2="110" stroke="#163866" stroke-width="1" />
    <line x1="1040" y1="25" x2="1040" y2="195" stroke="#163866" stroke-width="1" />
    <!-- Radar sweeping line -->
    <line x1="1040" y1="110" x2="1125" y2="110" stroke="#00f2fe" stroke-width="2.5" class="radar-sweep" filter="url(#slightGlow)" />
    <!-- Blips -->
    <circle cx="1010" cy="85" r="3" fill="#38ef7d" filter="url(#slightGlow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1075" cy="135" r="3.5" fill="#ff0055" filter="url(#slightGlow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Threat Stream Waveforms (Bottom) -->
  <g opacity="0.45">
    <path d="M 0 340 Q 300 290 600 340 T 1200 340" fill="none" stroke="#00f2fe" stroke-width="1.5" class="wave-line" />
    <path d="M 0 355 Q 300 380 600 355 T 1200 355" fill="none" stroke="#7928ca" stroke-width="1.5" class="wave-line" style="animation-duration: 8s;" />
  </g>

  <!-- FOREGROUND: Safe & High Contrast Header Content -->

  <!-- Top Status Badge -->
  <g transform="translate(60, 50)">
    <rect width="250" height="34" rx="17" fill="#08142c" stroke="url(#badgeBorder)" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#38ef7d" filter="url(#slightGlow)" />
    <circle cx="20" cy="17" r="8" fill="none" stroke="#38ef7d" class="status-ping" />
    <text x="36" y="22" fill="#a0c4f2" font-size="12" font-weight="600" class="mono" letter-spacing="1.2">AUTONOMOUS THREAT DEFENSE</text>
  </g>

  <!-- Repository Title -->
  <text x="60" y="145" fill="#ffffff" font-size="44" font-weight="800" class="mono" letter-spacing="-0.5">
    Awesome AI Cybersecurity
  </text>
  <text x="60" y="195" fill="url(#textGrad)" font-size="34" font-weight="700" class="mono" filter="url(#slightGlow)">
    &amp; Automated Threat Defense
  </text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="240" fill="#93a8cf" font-size="16" font-weight="400" class="mono">
    Curated SaaS &amp; Open-Source Ecosystem for AI-Driven SOC, Autonomous IR, XDR, and Agentic Defense
  </text>

  <!-- Pill Highlights in Foreground -->
  <g transform="translate(60, 275)">
    <!-- Pill 1: Autonomous SOC -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="18" fill="#0d1b38" stroke="#1f3b73" stroke-width="1" />
      <text x="24" y="22" fill="#00f2fe" font-size="13" font-weight="600" class="mono">⚡ Autonomous SOC</text>
    </g>

    <!-- Pill 2: Agentic Defense -->
    <g transform="translate(195, 0)">
      <rect width="180" height="36" rx="18" fill="#0d1b38" stroke="#1f3b73" stroke-width="1" />
      <text x="24" y="22" fill="#38ef7d" font-size="13" font-weight="600" class="mono">🛡️ Agentic Defense</text>
    </g>

    <!-- Pill 3: EDR / XDR / NDR -->
    <g transform="translate(390, 0)">
      <rect width="180" height="36" rx="18" fill="#0d1b38" stroke="#1f3b73" stroke-width="1" />
      <text x="24" y="22" fill="#c084fc" font-size="13" font-weight="600" class="mono">🔍 Next-Gen XDR &amp; NDR</text>
    </g>

    <!-- Pill 4: LLM Guardrails -->
    <g transform="translate(585, 0)">
      <rect width="190" height="36" rx="18" fill="#0d1b38" stroke="#1f3b73" stroke-width="1" />
      <text x="22" y="22" fill="#ff76ac" font-size="13" font-weight="600" class="mono">🤖 LLM Sec &amp; Guardrails</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 360)">
    <text x="0" y="0" fill="#58739d" font-size="12" font-weight="600" class="mono">
      ENTERPRISE SAAS BENCHMARKS  •  OPEN SOURCE STACKS  •  MITRE ATT&amp;CK AUTOMATION  •  CONTINUOUS 2026 UPDATES
    </text>
  </g>
</svg>